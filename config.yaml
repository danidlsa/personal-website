          content: "Project Analyst (2024 - current) · Inclusive Growth and Gender Specialist (2023 - 2024) · Programme Associate (2021 - 2022) · Consultant for the COVID-19 Response (2020 - 2021)"
        content: "As a part of the Gender Team in the UNDP Regional Hub for Latin America and the Caribbean, I develop data-driven tools and methodologies in the gender, inclusive growth and social protection areas, and provide technical assistance to UNDP country offices and governments. I designed and lead the Care Georeferencing Tool, which builds territory-level diagnoses of care supply, demand and accessibility (spotting 'care deserts') and has been implemented in countries such as Colombia, Peru, Uruguay, Dominican Republic, El Salvador, Honduras, Guatemala and Zanzibar (Tanzania). Recently, I also led a study that used social media scraping and AI models (GPT, BERT) to analyze digital violence against women in leadership positions in eight Ibero-American countries."

