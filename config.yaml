  # About
  about:
    enable: true
    title: "About Me"
    # image: "/images/me.png"
    content: |-
      I hold an MSc in Data Science from the Barcelona School of Economics and a BSc in Sociology from the Catholic University of Uruguay. My expertise spans data-driven social research, gender and public policy analysis, machine and deep learning modeling, natural language processing, data processing and visualization, geospatial analysis, as well as scientific dissemination and teaching.

      Since 2020 I have been working at the United Nations Development Programme (UNDP) Regional Hub for Latin America and the Caribbean, where I focus on leveraging data science tools for the design, implementation and evaluation of public policies aimed at reducing gender and social inequalities, with a particular emphasis on comprehensive care systems. You can check some of my publications [here](/publications).


    skills:
      enable: true
      title: "These are some of the tools and methods I work with:"
      items:
        - "**Applied AI:** LLM-based classification and information extraction, NLP, machine and deep learning (scikit-learn, PyTorch)"
        - "**Python:** pandas, NumPy, httpx, pydantic, pytest"
        - "**R:** tidyverse, Shiny, R Markdown / pagedown"
        - "**Geospatial:** QGIS, ArcGIS and StoryMaps, PostGIS, OpenStreetMap, accessibility modeling. Python (GeoPandas, Shapely 2, GeoParquet, DuckDB Spatial, H3, OSMnx, r5py) and R (sf, leaflet)"
        - "**Data collection:** web scraping, APIs (Google Places, Nominatim, Wikidata), ODK / KoboToolbox / QField"
        - "**Web and visualization:** Leaflet, static sites and templating (Jinja2, Hugo), dashboards (Shiny, PowerBI, Tableau), accessible design (WCAG 2.1 AA)"
        - "**Automation and cloud:** Git, GitHub Actions, scheduled data pipelines, AWS / Azure"
        - "**Statistics:** Stata, survey design, econometrics"
        - "**AI-assisted development:** agentic coding tools (e.g. Claude Code) to design, build and ship data products end to end"
        

