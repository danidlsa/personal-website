  # projects
  projects:
    enable: true
    title: "Featured Projects"
    items:
      - title: Care Georeferencing Tool
        content: Big data-based tool that maps care supply, demand and accessibility to locate 'care deserts'. Implemented in Colombia, Peru, Uruguay, Dominican Republic, El Salvador, Honduras, Guatemala and Zanzibar (Tanzania).
        image: /images/publications/care2.png
        featured:
          name: View report
          link: https://www.undp.org/latin-america/publications/care-cartographies-latin-america-and-caribbean-digital-tools-designing-evidence-based-care-policies
        badges:
          - "Google Places"
          - "OSRM"
          - "webscraping"
          - "crowdmapping"
          - "PostGIS"
          - "QField"
        links:
          - icon: fab fa-youtube
            url: https://www.youtube.com/watch?v=hvQtx95w8Ns&ab_channel=AmericalatinageneraRSCLACPNUD

      - title: GeoCareTool (Python library)
        content: Open-source library behind the Care Georeferencing Tool. Scrapes and cleans care facilities, models walking and public transport accessibility, and classifies care deserts by population group.
        image: /images/projects/geocaretool.svg
        featured:
          name: View code
          link: https://github.com/danidlsa/GeoCareTool
        badges:
          - "Python"
          - "Google Places API"
          - "OpenStreetMap"
          - "r5py"
          - "GTFS"
        links:
          - icon: fab fa-github
            url: https://github.com/danidlsa/GeoCareTool

      - title: Care and Support Map for Persons with Disabilities (Bogotá)
        content: Co-design, together with IDECA and Bogotá's Mayor's Office, of an accessible map of public care and support services for persons with disabilities and their caregivers. Includes an open-source demo built with Python and Leaflet.
        image: /images/projects/bogota-care-map.jpg
        featured:
          name: View StoryMap
          link: https://storymaps.arcgis.com/stories/500cf504d0734b4eb05c204a59e4e4a2
        badges:
          - "ArcGIS StoryMaps"
          - "Python"
          - "Leaflet"
          - "WCAG 2.1 AA"
        links:
          - icon: fas fa-globe
            url: https://danidlsa.github.io/MapaCuidadosyApoyosBogota/
          - icon: fab fa-github
            url: https://github.com/danidlsa/MapaCuidadosyApoyosBogota

      - title: Care and Support Map for Persons with Disabilities (Zanzibar)
        content: Dashboard mapping care, health and education services for persons with disabilities in Unguja, Zanzibar, built with the Care Georeferencing Tool and hosted by the Zanzibar National Council for Persons with Disabilities.
        image: /images/projects/zanzibar-care-map.jpg
        featured:
          name: View map
          link: https://jumuishi.ncpdsmz.go.tz/
        badges:
          - "R Shiny"
          - "Leaflet"
          - "ODK fieldwork"
          - "English / Kiswahili"
        links:
          - icon: fab fa-github
            url: https://github.com/danidlsa/pwd-zanzibar

      - title: La Gestoría Cultural
        content: Non-profit side project that gathers Montevideo's cultural agenda (music, theater, film, dance and more) in one place. Scrapes 24 public sources three times a day, deduplicates and classifies around 700 events, and publishes a static site.
        image: /images/projects/la-gestoria-cultural.svg
        featured:
          name: Visit site
          link: http://lagestoriacultural.uy/
        badges:
          - "Python"
          - "web scraping"
          - "pydantic"
          - "GitHub Actions"
          - "Jinja2"
        links:
          - icon: fab fa-github
            url: https://github.com/danidlsa/la-gestoria-cultural

      - title: Digital Violence Against Women in Ibero-America
        content: Social media scraping and AI models to identify, classify and characterize digital violence against women in leadership positions in eight countries (UNDP - SEGIB).
        image: /images/publications/digital-violence.svg
        featured:
          name: View policy note
          link: https://www.undp.org/es/latin-america/publicaciones/entre-el-menosprecio-y-las-amenazas-analisis-de-violencia-digital-contra-las-mujeres-en-ocho-paises-de-iberoamerica
        badges:
          - "NLP"
          - "GPT models"
          - "BERT"
          - "webscraping"

      - title: Forecasting Refugee Flows
        content: A Machine Learning Approach using Non-conventional Data such as Google Trends and GDELT, in collaboration with UNHCR. Top 3 Master's Thesis (BSE, 2023).
        image: /images/publications/refugees.png
        featured:
          name: View project
          link: https://repositori.upf.edu/handle/10230/58359
        badges:
          - "decision trees"
          - "gradient boosting"
          - "google trends"
        links:
          - icon: fab fa-github
            url: https://github.com/danidlsa/refugees

      - title: Detecting Informal Settlements using Satellite Imagery
        content: Exercise to map informal settlements across the globe using VHR satellite imagery and Convolutional Neural Networks.
        image: /images/publications/settlement.png
        featured:
          name: View paper
          link: https://drive.google.com/file/d/1qtXUqI5BElXC-HJI-x4Ur-m3puKcLk7v/view?usp=drive_link
        badges:
