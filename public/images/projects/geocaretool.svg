    <text x="1060" y="212" fill="#ffffff">Care deserts</text>
    <text x="1060" y="240" font-size="16" font-weight="400" fill="#ffffff">by population group</text>
  </g>
  <g stroke="#4a7d78" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
