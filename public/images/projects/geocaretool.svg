    <text x="135" y="212" fill="#1f4e4a">Scraping</text>
    <text x="135" y="240" font-size="16" font-weight="400" fill="#4a7d78">Google Places</text>

    <rect x="270" y="170" width="190" height="96" rx="16" fill="#ffffff" stroke="#9cc5bf" stroke-width="3"/>
    <text x="365" y="212" fill="#1f4e4a">Cleaning</text>
